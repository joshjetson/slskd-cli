[package]
name = "slskd-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "A terminal client for slskd — search, queue, and monitor Soulseek transfers without a browser"
license = "MIT"
readme = "README.md"
repository = "https://github.com/joshjetson/slskd-cli"
keywords = ["soulseek", "slskd", "tui", "cli", "music"]
categories = ["command-line-utilities"]

[[bin]]
name = "slsk"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
directories = "5"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
toml = "0.8"
uuid = { version = "1", features = ["v4"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
